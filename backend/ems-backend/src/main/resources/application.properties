spring.application.name=ems-backend

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/emsdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:emsuser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:emspassword}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_FORMAT_SQL:false}

server.port=${PORT:8080}
